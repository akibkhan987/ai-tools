<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stake Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one column — add-result form, four period totals, breakdown table, entries list */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#F5F7F6; --line:#D9E0DC; --line-strong:#BCC7C1;
  --fg:#14211C; --muted:#5B6A63;
  --accent:#0E5E47; --accent-fg:#FFFFFF; --accent-soft:#DCEDE6;
  --win:#1B7F45; --win-soft:#DDF1E4; --loss:#B8392A; --loss-soft:#F8E1DD;
  --head:#10241D; --head-fg:#E8F1ED; --head-muted:#94ABA1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1311; --surface:#141C19; --surface-2:#18221E; --line:#24312C; --line-strong:#33443D;
  --fg:#E3ECE8; --muted:#97A8A0;
  --accent:#3DBB8C; --accent-fg:#06140F; --accent-soft:#16352A;
  --win:#4CC983; --win-soft:#143223; --loss:#F07563; --loss-soft:#3A1B17;
  --head:#08100D; --head-fg:#E3ECE8; --head-muted:#7F948B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:var(--head-fg);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{margin-right:auto;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;letter-spacing:.03em;text-transform:none;color:var(--head-muted);margin-top:3px}
main{display:flex;flex-direction:column;gap:16px;padding-block:18px 48px}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px 10px}
.ph h2{margin-right:auto}
.pb{padding:0 16px 16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.del{color:var(--muted);background:transparent}
.btn.del:hover{color:var(--loss);border-color:var(--loss)}
.btn.del.armed{background:var(--loss);border-color:var(--loss);color:#fff}
header .btn{background:transparent;color:var(--head-fg);border-color:rgba(255,255,255,.22)}

/* add form */
.add{display:grid;grid-template-columns:140px minmax(0,1.4fr) auto minmax(0,1fr) auto;gap:10px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fld input,.fld select,select.plain{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;width:100%;min-width:0;height:40px}
.wl{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;height:40px}
.wl button{border:0;background:var(--surface-2);padding:0 16px;cursor:pointer;font-weight:600;color:var(--muted)}
.wl button+button{border-left:1px solid var(--line-strong)}
.wl button.on.w{background:var(--win);color:#fff}
.wl button.on.l{background:var(--loss);color:#fff}
.add .btn.primary{height:40px}
.acts{display:inline-flex;gap:4px}
.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
tr.being-edited td{background:var(--accent-soft)}
.note-row{grid-column:1/-1}

/* totals */
.totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tot{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tot .lbl{font-size:11px}
.tot .v{font-family:var(--f-mono);font-size:22px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.tot .s{font-size:12px;color:var(--muted)}
.pos{color:var(--win)} .neg{color:var(--loss)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line-strong);border-bottom:0;font-weight:600}
.r{text-align:right}
.tag{display:inline-block;padding:1px 8px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;white-space:nowrap}
.muted{color:var(--muted)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:3px}
footer{font-size:12.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
footer .linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-fg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50}

@media (max-width:720px){
  .add{grid-template-columns:1fr 1fr}
  .add .grp,.note-row{grid-column:1/-1}
  .wl{width:100%}.wl button{flex:1}
  .add .btn.primary{grid-column:1/-1}
  .totals{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){.hide-sm{display:none}.tot .v{font-size:19px}
  table{font-size:13px}th,td{padding:8px 4px}th:first-child,td:first-child{padding-left:12px}th:last-child,td:last-child{padding-right:12px}
  .tag{font-size:12px;padding:1px 6px}.btn.sm{padding:3px 7px;font-size:12px}.ph{padding:12px 12px 8px}.acts{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="brand">Stake Ledger<small>Daily profit &amp; loss by tipster group</small></div>
    <button class="btn" id="exportBtn" type="button">Export month (CSV)</button>
  </div>
</header>

<main class="wrap">
  <!-- Add -->
  <section class="panel">
    <div class="ph"><h2 id="formTitle">Add today's result</h2><button class="btn sm" type="button" id="cancelEdit" hidden>Cancel edit</button></div>
    <form class="pb add" id="addForm" autocomplete="off">
      <div class="fld"><label for="fDate">Date</label><input type="date" id="fDate" required></div>
      <div class="fld grp"><label for="fGroup">Tipster group</label><input id="fGroup" list="groupList" placeholder="e.g. Elite Tips VIP" required><datalist id="groupList"></datalist></div>
      <div class="fld"><span class="lbl">Result</span>
        <div class="wl" role="group" aria-label="Won or lost">
          <button type="button" class="w on" id="wBtn" aria-pressed="true">Won</button>
          <button type="button" class="l" id="lBtn" aria-pressed="false">Lost</button>
        </div></div>
      <div class="fld"><label for="fAmount">Amount</label><input type="number" id="fAmount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
      <button class="btn primary" type="submit" id="submitBtn">Add</button>
      <div class="fld note-row"><label for="fNote">Note (optional)</label><input id="fNote" placeholder="e.g. 3 tips, 2 won"></div>
    </form>
  </section>

  <!-- Totals -->
  <section class="totals" id="totals"></section>

  <!-- Breakdown -->
  <section class="panel">
    <div class="ph"><h2>Breakdown</h2>
      <div class="seg" id="viewSeg">
        <button type="button" data-v="day" aria-pressed="true">Daily</button>
        <button type="button" data-v="week" aria-pressed="false">Weekly</button>
        <button type="button" data-v="month" aria-pressed="false">Monthly</button>
        <button type="button" data-v="group" aria-pressed="false">By tipster group</button>
      </div>
    </div>
    <div class="tw" id="breakdown"></div>
  </section>

  <!-- Entries -->
  <section class="panel">
    <div class="ph"><h2>Entries</h2>
      <select class="plain" id="monthSel" aria-label="Choose month" style="width:auto"></select>
    </div>
    <div class="tw" id="entries"></div>
  </section>

  <footer>
    <span>Saved in this browser only.</span>
    <button class="linkbtn" id="backupBtn" type="button">Download backup</button>
    <button class="linkbtn" id="restoreBtn" type="button">Restore backup</button>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    <span style="margin-left:auto">Currency
      <select id="curSel" aria-label="Currency" style="margin-left:4px">
        <option value="$">$</option><option value="£">£</option><option value="€">€</option><option value="₹">₹</option><option value="৳">৳</option><option value="₦">₦</option><option value="R">R</option>
      </select></span>
  </footer>
</main>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY = "stake-ledger-v2", OLD = "stake-ledger-v1";
let S = { entries: [], currency: "$", view: "day", month: "" };

/* dates */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fDay = s => { const d = parse(s); return `${DW[d.getDay()]} ${d.getDate()} ${M[d.getMonth()]}`; };
const fWeek = s => { const e = parse(s); e.setDate(e.getDate()+6); const a = parse(s); return `${a.getDate()} ${M[a.getMonth()]} – ${e.getDate()} ${M[e.getMonth()]} ${e.getFullYear()}`; };
const fMonth = k => { const [y,m] = k.split("-"); return `${["January","February","March","April","May","June","July","August","September","October","November","December"][+m-1]} ${y}`; };

/* money */
const money = (v, signed) => {
  const a = Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const sign = v>0 ? (signed?"+":"") : v<0 ? "−" : "";
  return sign + S.currency + a;
};
const cls = v => v>0 ? "pos" : v<0 ? "neg" : "";

/* storage */
function load(){
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || "null");
    if (j) { S.entries = j.entries || []; S.currency = j.currency || "$"; return; }
    // carry over results from the earlier, detailed version
    const o = JSON.parse(localStorage.getItem(OLD) || "null");
    if (o?.bets?.length) {
      S.entries = o.bets.filter(b => b.result && b.result!=="pending" && b.result!=="void").map(b => {
        const st = +b.stake||0, p = b.result==="won" ? st*((+b.odds||1)-1) : b.result==="cashout" ? (+b.returns||0)-st : -st;
        return { id:b.id, date:b.date, group:b.tipster||"Unassigned", amount:Math.round(p*100)/100, note:b.event||"", createdAt:b.createdAt||Date.now() };
      });
      S.currency = o.settings?.currency || "$";
      save();
    }
  } catch(e){}
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({entries:S.entries, currency:S.currency})); } catch(e){ toast("Couldn't save. Your browser may be blocking storage."); } }
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2400); }

/* sums */
function sum(list){ let won=0, lost=0; for (const e of list){ if (e.amount>=0) won+=e.amount; else lost+=-e.amount; } return {won, lost, net:won-lost, n:list.length}; }

/* render */
function render(){
  const all = [...S.entries].sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt-a.createdAt);
  const t = today(), ws = weekStart(t), ms = t.slice(0,8)+"01";

  // group suggestions
  const groups = [...new Set(all.map(e=>e.group))].sort((a,b)=>a.localeCompare(b));
  $("#groupList").innerHTML = groups.map(g=>`<option value="${esc(g)}">`).join("");

  // totals
  const card = (label, list) => { const s = sum(list);
    return `<div class="panel tot"><span class="lbl">${label}</span><span class="v ${cls(s.net)}">${money(s.net,true)}</span><span class="s">Won ${money(s.won)} · Lost ${money(s.lost)}</span></div>`; };
  $("#totals").innerHTML =
    card("Today", all.filter(e=>e.date===t)) +
    card("This week", all.filter(e=>e.date>=ws && e.date<=t)) +
    card("This month", all.filter(e=>e.date>=ms && e.date<=t)) +
    card("All time", all);

  renderBreakdown(all);

  // months for entries list
  const months = [...new Set([t.slice(0,7), ...all.map(e=>e.date.slice(0,7))])].sort().reverse();
  if (!S.month || !months.includes(S.month)) S.month = t.slice(0,7);
  $("#monthSel").innerHTML = months.map(m=>`<option value="${m}" ${m===S.month?"selected":""}>${fMonth(m)}</option>`).join("");
  const list = all.filter(e=>e.date.slice(0,7)===S.month);
  if (!list.length){ $("#entries").innerHTML = `<div class="empty"><b>No entries for ${fMonth(S.month)}</b>Add a result above. Each line is one tipster group's win or loss for a day.</div>`; }
  else {
    const s = sum(list);
    $("#entries").innerHTML = `<table><thead><tr><th>Date</th><th>Tipster group</th><th class="hide-sm">Note</th><th class="r">Won / lost</th><th></th></tr></thead><tbody>${
      list.map(e=>`<tr class="${e.id===editingId?"being-edited":""}"><td class="num">${fDay(e.date)}</td><td><span class="tag">${esc(e.group)}</span></td><td class="hide-sm muted">${esc(e.note)}</td><td class="r num ${cls(e.amount)}">${money(e.amount,true)}</td><td class="r"><span class="acts"><button class="btn sm" type="button" data-edit="${e.id}">Edit</button><button class="btn sm del" type="button" data-del="${e.id}">Delete</button></span></td></tr>`).join("")
    }</tbody><tfoot><tr><td colspan="2">${fMonth(S.month)} total</td><td class="hide-sm"></td><td class="r num ${cls(s.net)}">${money(s.net,true)}</td><td></td></tr></tfoot></table>`;
  }
  $("#curSel").value = S.currency;
}

function renderBreakdown(all){
  const v = S.view;
  const keyOf = v==="day" ? (e=>e.date) : v==="week" ? (e=>weekStart(e.date)) : v==="month" ? (e=>e.date.slice(0,7)) : (e=>e.group);
  const label = v==="day" ? fDay : v==="week" ? fWeek : v==="month" ? fMonth : (g=>`<span class="tag">${esc(g)}</span>`);
  const m = new Map();
  for (const e of all){ const k = keyOf(e); if (!m.has(k)) m.set(k, []); m.get(k).push(e); }
  let rows = [...m.entries()].map(([k,l]) => ({k, ...sum(l)}));
  rows = v==="group" ? rows.sort((a,b)=>b.net-a.net) : rows.sort((a,b)=>b.k.localeCompare(a.k));
  if (v==="day") rows = rows.slice(0, 31);
  if (!rows.length){ $("#breakdown").innerHTML = `<div class="empty"><b>Nothing to show yet</b>Your totals by day, week, month and tipster group appear here once you add results.</div>`; return; }
  const head = {day:"Day", week:"Week", month:"Month", group:"Tipster group"}[v];
  const tot = sum(v==="day" ? all.filter(e=>rows.some(r=>r.k===e.date)) : all);
  $("#breakdown").innerHTML = `<table><thead><tr><th>${head}</th><th class="r hide-sm">Entries</th><th class="r">Won</th><th class="r">Lost</th><th class="r">Profit / loss</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="${v==="group"?"":"num"}">${label(r.k)}</td><td class="r num hide-sm">${r.n}</td><td class="r num pos">${r.won?money(r.won):"—"}</td><td class="r num neg">${r.lost?money(r.lost):"—"}</td><td class="r num ${cls(r.net)}"><b>${money(r.net,true)}</b></td></tr>`).join("")
  }</tbody><tfoot><tr><td>${v==="day"?"Last "+rows.length+" days":"Total"}</td><td class="r num hide-sm">${tot.n}</td><td class="r num pos">${money(tot.won)}</td><td class="r num neg">${money(tot.lost)}</td><td class="r num ${cls(tot.net)}">${money(tot.net,true)}</td></tr></tfoot></table>`;
}

/* add form */
let isWin = true;
function setWL(w){ isWin = w; $("#wBtn").classList.toggle("on", w); $("#lBtn").classList.toggle("on", !w); $("#wBtn").setAttribute("aria-pressed", String(w)); $("#lBtn").setAttribute("aria-pressed", String(!w)); }
$("#wBtn").addEventListener("click", () => setWL(true));
$("#lBtn").addEventListener("click", () => setWL(false));
$("#addForm").addEventListener("submit", e => {
  e.preventDefault();
  const amt = +$("#fAmount").value, group = $("#fGroup").value.trim();
  if (!(amt>0)) { toast("Enter an amount above zero."); return; }
  if (!group) { toast("Enter the tipster group name."); return; }
  const data = { date:$("#fDate").value || today(), group, amount: Math.round((isWin?amt:-amt)*100)/100, note:$("#fNote").value.trim() };
  if (editingId){
    S.entries = S.entries.map(x => x.id===editingId ? {...x, ...data} : x);
    toast("Entry updated"); stopEdit();
  } else {
    S.entries.push({ id:newId(), createdAt:Date.now(), ...data });
    toast(isWin ? `Added: won ${money(amt)}` : `Added: lost ${money(amt)}`);
    $("#fAmount").value = ""; $("#fNote").value = ""; $("#fAmount").focus();
  }
  save(); S.month = data.date.slice(0,7); render();
});

/* edit */
let editingId = null;
function startEdit(id){
  const x = S.entries.find(e => e.id===id); if (!x) return;
  editingId = id;
  $("#fDate").value = x.date; $("#fGroup").value = x.group; $("#fAmount").value = Math.abs(x.amount); $("#fNote").value = x.note || "";
  setWL(x.amount >= 0);
  $("#formTitle").textContent = "Edit entry"; $("#submitBtn").textContent = "Save changes"; $("#cancelEdit").hidden = false;
  $("#addForm").closest(".panel").classList.add("editing");
  render(); $("#addForm").closest(".panel").scrollIntoView({behavior:"smooth", block:"start"}); $("#fAmount").focus({preventScroll:true});
}
function stopEdit(){
  editingId = null;
  $("#formTitle").textContent = "Add today's result"; $("#submitBtn").textContent = "Add"; $("#cancelEdit").hidden = true;
  $("#addForm").closest(".panel").classList.remove("editing");
  $("#fDate").value = today(); $("#fGroup").value = ""; $("#fAmount").value = ""; $("#fNote").value = ""; setWL(true);
}
$("#cancelEdit").addEventListener("click", () => { stopEdit(); render(); });

/* delete (tap twice) */
$("#entries").addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]"); if (ed) { startEdit(ed.dataset.edit); return; }
  const b = e.target.closest("[data-del]"); if (!b) return;
  if (b.dataset.armed !== "1"){ b.dataset.armed="1"; b.classList.add("armed"); b.textContent="Confirm"; setTimeout(()=>{ if (b.isConnected){ b.dataset.armed=""; b.classList.remove("armed"); b.textContent="Delete"; } }, 3000); return; }
  if (b.dataset.del===editingId) stopEdit();
  S.entries = S.entries.filter(x => x.id !== b.dataset.del); save(); render(); toast("Entry deleted");
});

/* controls */
$("#viewSeg").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b) return; S.view = b.dataset.v; [...$("#viewSeg").children].forEach(x=>x.setAttribute("aria-pressed", String(x===b))); render(); });
$("#monthSel").addEventListener("change", e => { S.month = e.target.value; render(); });
$("#curSel").addEventListener("change", e => { S.currency = e.target.value; save(); render(); });

/* files */
function saveFile(name, data, type){
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
$("#exportBtn").addEventListener("click", () => {
  const list = S.entries.filter(e=>e.date.slice(0,7)===S.month).sort((a,b)=>a.date.localeCompare(b.date));
  if (!list.length) { toast(`No entries in ${fMonth(S.month)} to export.`); return; }
  const rows = [["Date","Tipster group","Won","Lost","Profit/Loss","Note"], ...list.map(e=>[e.date, e.group, e.amount>0?e.amount.toFixed(2):"", e.amount<0?(-e.amount).toFixed(2):"", e.amount.toFixed(2), e.note])];
  const s = sum(list); rows.push([], ["Total","", s.won.toFixed(2), s.lost.toFixed(2), s.net.toFixed(2), ""]);
  const byG = new Map(); list.forEach(e => byG.set(e.group, [...(byG.get(e.group)||[]), e]));
  rows.push([], ["Tipster group","","Won","Lost","Profit/Loss",""]);
  [...byG.entries()].map(([g,l])=>[g, sum(l)]).sort((a,b)=>b[1].net-a[1].net).forEach(([g,x]) => rows.push([g,"",x.won.toFixed(2),x.lost.toFixed(2),x.net.toFixed(2),""]));
  saveFile(`stake-ledger-${S.month}.csv`, "﻿" + rows.map(r=>r.map(cell).join(",")).join("\n"), "text/csv;charset=utf-8");
  toast(`Exported ${fMonth(S.month)}`);
});
$("#backupBtn").addEventListener("click", () => { saveFile(`stake-ledger-backup-${today()}.json`, JSON.stringify({app:"stake-ledger", version:2, entries:S.entries, currency:S.currency}, null, 2), "application/json"); toast("Backup saved"); });
$("#restoreBtn").addEventListener("click", () => $("#restoreFile").click());
$("#restoreFile").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!Array.isArray(j.entries)) throw 0;
    const ids = new Set(S.entries.map(x=>x.id)); let added = 0;
    j.entries.forEach(x => { if (x && x.id && x.date && !ids.has(x.id)) { S.entries.push(x); added++; } });
    if (j.currency) S.currency = j.currency;
    save(); render(); toast(`Restored ${added} entries`);
  } catch(_) { toast("That file isn't a Stake Ledger backup."); }
});

/* boot */
$("#fDate").value = today();
load(); render();
})();
</script>
</body>
</html>
